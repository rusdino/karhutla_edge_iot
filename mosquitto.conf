# Jalankan:  mosquitto -c mosquitto.conf -v
# (Windows/Linux: buka port 6669 TCP di firewall untuk jaringan privat)
listener 6669 0.0.0.0
allow_anonymous true

# Untuk penggunaan nyata, aktifkan autentikasi:
#   mosquitto_passwd -c passwd karhutla
#   allow_anonymous false
#   password_file passwd
# lalu isi MQTT_USER/MQTT_PASS di config.py dan config.h
