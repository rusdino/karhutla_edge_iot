; PlatformIO Project Configuration File — Karhutla Edge-IoT (Native ESP-IDF tanpa Arduino)
;
; Perintah:
;   pio run -e hils                   ; kompilasi mode HILS (sensor dari laptop via MQTT)
;   pio run -e hils -t upload         ; flash mode HILS ke ESP32
;   pio run -e riil                   ; kompilasi mode Riil (sensor fisik Sharp + MQ-135)
;   pio run -e riil -t upload         ; flash mode Riil ke ESP32
;   pio device monitor -b 115200      ; pantau log serial ESP-IDF

[env]
platform = espressif32
board = esp32dev
; Menggunakan SDK Native ESP-IDF v5.5.5 murni (entry point app_main, tanpa FrameworkArduino)
extra_scripts = pre:espidf_sdk.py
monitor_speed = 115200

[env:hils]
build_flags =
    -DMODE_HILS=1

[env:riil]
build_flags =
    -DMODE_HILS=0
