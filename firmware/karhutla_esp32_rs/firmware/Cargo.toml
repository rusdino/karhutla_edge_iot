[package]
name = "karhutla-esp32"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["hils"]
hils = []
riil = []

[dependencies]
karhutla-core = { path = "../crates/karhutla-core" }
esp-hal = { version = "1.2.2", features = ["esp32", "unstable", "rt"] }
esp-rtos = { version = "0.4.0", features = ["esp32", "embassy", "esp-radio", "esp-alloc"] }
esp-radio = { version = "1.0.0-beta.1", features = ["esp32", "wifi", "esp-alloc", "unstable"] }
esp-alloc = "0.11.0"
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32"] }
esp-println = { version = "0.18.0", features = ["esp32"] }
esp-backtrace = { version = "0.20.0", features = ["esp32", "println", "panic-handler", "halt-cores"] }
esp-storage = { version = "0.10.0", features = ["esp32"] }
embassy-executor = "0.10.0"
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embassy-net = { version = "0.9.1", features = ["tcp", "dhcpv4", "medium-ethernet"] }
static_cell = "2.1"
nb = "1.1"
